# ============================================================
# default.conf — virtueller Host für ResidentFlow
# - SPA-Fallback (try_files → index.html)
# - /api-Proxy → Fastify-Backend
# - Security-Header (HSTS, CSP, X-Frame, etc.)
# - Kein Cookie-Banner nötig (Plausible cookieless §16)
# ============================================================

upstream api_backend {
  server api:3001;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ----------------------------------------------------------
  # Security-Header
  # ----------------------------------------------------------
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Content-Security-Policy:
  # - default-src 'self'
  # - Plausible analytics (self-hosted über /stats/ proxied)
  # - cal.com Embed für Terminbuchung
  # - Kein 'unsafe-eval', kein 'unsafe-inline' (außer styles für React)
  add_header Content-Security-Policy
    "default-src 'self'; "
    "script-src 'self' 'unsafe-inline'; "
    "style-src 'self' 'unsafe-inline'; "
    "img-src 'self' data: https:; "
    "connect-src 'self'; "
    "frame-src https://cal.com; "
    "font-src 'self';"
    always;

  # ----------------------------------------------------------
  # Statische Assets — lange Cache-Zeit für versionierte Dateien
  # ----------------------------------------------------------
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ----------------------------------------------------------
  # /api — Proxy zum Fastify-Backend
  # ----------------------------------------------------------
  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # ----------------------------------------------------------
  # SPA-Fallback — alle unbekannten Pfade → index.html
  # (React Router übernimmt das clientseitige Routing)
  # ----------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ----------------------------------------------------------
  # robots.txt und sitemap.xml direkt aus dist/ ausliefern
  # ----------------------------------------------------------
  location = /robots.txt {
    try_files $uri =404;
  }

  location = /sitemap.xml {
    try_files $uri =404;
    add_header Content-Type "application/xml";
  }
}
